    <script>
      (function() {
        // Prevent browser extension wallet injection collision and suppress cross-origin 3rd-party script noise in sandboxed iframes
        try {
          const origDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            try {
              return origDefineProperty.call(this, obj, prop, descriptor);
            } catch (err) {
              if (
                String(prop).includes('isZerion') ||
                String(prop).includes('ethereum') ||
                String(err?.message || '').includes('Cannot redefine property')
              ) {
                return obj;
              }
              throw err;
            }
          };
        } catch (e) {}

        window.addEventListener('error', function(event) {
          const msg = String(event?.message || '');
          const filename = String(event?.filename || '');
          if (
            msg === 'Script error.' ||
            msg.includes('isZerion') ||
            msg.includes('Cannot redefine property') ||
            msg.includes('ethereum') ||
            msg.includes('solana') ||
            filename.includes('clarity.ms') ||
            filename.includes('disqus.com') ||
            filename.includes('disquscdn.com')
          ) {
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
            if (typeof event.preventDefault === 'function') event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          const reasonStr = String(event?.reason?.message || event?.reason || '');
          if (
            reasonStr.includes('isZerion') ||
            reasonStr.includes('Cannot redefine property') ||
            reasonStr.includes('clarity') ||
            reasonStr.includes('disqus')
          ) {
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
            if (typeof event.preventDefault === 'function') event.preventDefault();
          }
        }, true);
      })();
    </script>
